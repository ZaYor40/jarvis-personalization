<script>
// ── Cold boot — étape 1 : flag AVANT home.js + masque la shell ─────────
// Comportement par défaut : sleep screen, clap double pour wake.
// ?wake=0 → skip tout (dashboard direct, pour dev)
// ?wake=1 → bypass sleep, wake immédiat (pour dev sans micro)
(function () {
  const params = new URLSearchParams(location.search);
  const mode   = params.get('wake');
  if (mode === '0') return;             // skip total (dev)
  // WAKEUP_ENABLED=false → accès direct au dashboard, aucune séquence de veille.
  // Sans ce garde-fou, sur une install sans micro (VPS/headless) l'écran
  // « double clap pour réveiller » bloque tout accès (le seul déclencheur est
  // le clap, désactivé). ?wake=1 force quand même la séquence (dev).
  if (mode !== '1' && window.JARVIS_WAKEUP_ENABLED === false) return;
  // Déjà réveillé dans cette session de navigateur ? On ne rejoue PAS le wake à
  // chaque retour sur la home (revenir d'un onglet = reload de home.html). Le flag
  // sessionStorage s'efface à la fermeture de l'onglet → wake une fois par session.
  // ?wake=1 force quand même (dev).
  if (mode !== '1') {
    try { if (sessionStorage.getItem('jarvis_woke') === '1') return; } catch (e) {}
  }
  window.__jarvisWakeActive = true;
  window.__jarvisWakeForceImmediate = (mode === '1');
  // Cache TOUT le chrome dashboard sauf l'orbe (le wake utilise #orb-canvas).
  // Cible les éléments un-à-un pour ne pas masquer .home-orb-wrap qui est
  // dans #home-shell. Inclut les éléments appendChild'és sur document.body
  // par _shared.js (Mission Control, watermark, rooms nav, etc.).
  const css = document.createElement('style');
  css.id = 'wake-shell-hider';
  css.textContent = ''
    + '.home-top, .cam-overlay, .hc-widget, .home-channel,'
    + ' .rooms-mc, .rooms-pages, .mode-watermark, .scene-card,'
    + ' .mission-overlay, .cmdk-root, .notif-stack, .inspect-hint,'
    + ' .mode-glow, #globe-container, #page-frame {'
    + ' opacity: 0 !important; pointer-events: none !important;'
    + ' transition: opacity 0.4s cubic-bezier(0.32,0.72,0,1); }';
  document.head.appendChild(css);
}());
</script>
<!-- Voix : pipeline temps réel LiveKit (remplace l'ancien voice.js in-house). -->

<script>
// ── Cold boot — étape 2 : sleep screen → clap → wake_sequence ─────────
// Cycle complet :
//   1. À l'arrivée : sleep screen (z-index 9500, sleep visible)
//   2. CustomEvent 'jarvis-wake' (clap backend OU window.triggerWake() dev)
//      → fade out sleep, mount wake_sequence
//   3a. wake_sequence onComplete : inject orb dashboard, fade in shell
//   3b. wake_sequence onFailure (FACE refusée) : destroy wake, re-mount sleep
(function () {
  if (!window.__jarvisWakeActive) return;
  if (typeof window.createWakeSequence !== 'function' ||
      typeof window.createSleepScreen  !== 'function') return;

  let sleep = null;
  let seq   = null;
  // Prénom configuré (USER_FIRSTNAME) — récupéré tôt, fire-and-forget, pour que
  // mountWake() reste synchrone (le crossfade sleep/wake ne tolère aucun délai).
  // Repli sur '' (le wake n'affiche alors aucun nom).
  let _userName = '';
  fetch('/api/wakeup/status', { headers: window.Jarvis && Jarvis.authHeaders ? Jarvis.authHeaders() : {} })
    .then(function (r) { return r.json(); })
    .then(function (s) { _userName = (s && s.user_firstname) || ''; })
    .catch(function () {});

  function mountSleep() {
    const sleepRoot = document.createElement('div');
    sleepRoot.id = 'wake-sleep-root';
    document.body.appendChild(sleepRoot);
    sleep = window.createSleepScreen(sleepRoot, { onWake: enterWake });
  }

  function enterWake(source) {
    if (!sleep) return;
    const oldSleep = sleep;
    sleep = null;
    // Fade out sleep + mount wake en parallèle (crossfade)
    // Sleep fade 200ms (court) — le wake est mounté INSTANTANÉMENT en-dessous,
    // donc dès que le sleep s'efface, le wake est déjà entièrement rendu.
    // Pas de zone de transparence pendant laquelle on verrait juste le bg sombre.
    oldSleep.fadeOut(200, function () { oldSleep.destroy(); });
    mountWake(source);
  }

  function mountWake(source) {
    const root = document.createElement('div');
    root.id = 'wake-cold-boot-root';
    // Mount INSTANT (pas de fade-in) : le sleep par-dessus gère le crossfade.
    // Comme ça il n'y a jamais un moment où ni sleep ni wake n'est entièrement
    // rendu, donc pas de moment où on voit le fond noir.
    document.body.appendChild(root);

    // Préchauffe le briefing PENDANT le wakeup (résout le preset + pré-synthétise
    // l'audio en parallèle) → enchaînement immédiat à l'entrée ONLINE, sans
    // attendre la synthèse phrase par phrase.
    try { window.prepareBriefing && window.prepareBriefing(window._briefingPreset || 'morning'); }
    catch (e) { console.warn('[wake] prepare briefing', e); }

    seq = window.createWakeSequence(root, {
      userName:     _userName,
      // Même règle que le bouton "Mode veille" : clic/touche = accès physique
      // direct (pas de scan), clap = source potentiellement distante (scan
      // requis). requireFace:false saute directement BOOT → CONVERGE côté
      // wake_sequence.js (le cinéma d'orbe/injection tourne quand même).
      requireFace:  source === 'clap',
      targetCanvas: document.getElementById('orb-canvas'),
      onComplete:   onWakeComplete,
      onFailure:    onWakeFailure,
    });

    if (!seq) onWakeFailure();
  }

  function onWakeComplete() {
    window.__jarvisWakeActive = false;
    // Marque le réveil comme fait pour cette session → pas de replay en revenant
    // sur la home depuis un autre espace.
    try { sessionStorage.setItem('jarvis_woke', '1'); } catch (e) {}
    if (typeof window.__jarvisInjectOrb === 'function' && seq && seq.getOrb) {
      window.__jarvisInjectOrb(seq.getOrb());
    }
    // Shell + chrome via transition opacité 0→1 (mêmes cibles que le masquage)
    const hider = document.getElementById('wake-shell-hider');
    if (hider) {
      hider.textContent = ''
        + '.home-top, .cam-overlay, .hc-widget, .home-channel,'
        + ' .rooms-mc, .rooms-pages, .mode-watermark, .scene-card,'
        + ' .mission-overlay, .cmdk-root, .notif-stack, .inspect-hint,'
        + ' #globe-container, #page-frame {'
        + ' opacity: 1; transition: opacity 0.4s cubic-bezier(0.32,0.72,0,1); }';
      setTimeout(function () { if (hider.parentNode) hider.parentNode.removeChild(hider); }, 450);
    }
    // Fade out overlay wake (UI uniquement, l'orbe reste sur #orb-canvas)
    const r = document.getElementById('wake-cold-boot-root');
    if (r) {
      r.style.transition = 'opacity 0.35s cubic-bezier(0.32,0.72,0,1)';
      r.style.opacity = '0';
      setTimeout(function () {
        try { seq.destroy(); } catch (e) {}
        seq = null;
        if (r.parentNode) r.parentNode.removeChild(r);
      }, 400);
    }

    // Briefing automatique post-wakeup (no-op si BRIEFING_ENABLED=false côté backend).
    try { window.runBriefing && window.runBriefing(window._briefingPreset || 'morning'); }
    catch (e) { console.warn('[wake] briefing', e); }
  }

  function onWakeFailure() {
    // BLOCAGE accès. Détruit wake (et l'orbe partagé pour libérer canvas),
    // re-monte le sleep screen.
    const orbRef = seq && seq.getOrb ? seq.getOrb() : null;
    const r = document.getElementById('wake-cold-boot-root');
    if (r) {
      r.style.transition = 'opacity 0.35s cubic-bezier(0.32,0.72,0,1)';
      r.style.opacity = '0';
      setTimeout(function () {
        try { if (seq) seq.destroy(); } catch (e) {}
        try { if (orbRef && orbRef.destroy) orbRef.destroy(); } catch (e) {}
        seq = null;
        if (r.parentNode) r.parentNode.removeChild(r);
        mountSleep();
      }, 400);
    } else {
      try { if (seq) seq.destroy(); } catch (e) {}
      seq = null;
      mountSleep();
    }
  }

  // Lancement
  if (window.__jarvisWakeForceImmediate) {
    mountWake();   // ?wake=1 : bypass sleep
  } else {
    mountSleep(); // défaut : attente clap
  }
})();
</script>
<script>
window.loadViewSkills = async function () {
  try {
    const r = await fetch('/api/skills/view-scripts', { headers: window.Jarvis && Jarvis.authHeaders ? Jarvis.authHeaders() : {} });
    if (!r.ok) return;
    const { styles = [], scripts = [] } = await r.json();

    // Retire les anciens assets de vues (data-view-skill="1")
    document.querySelectorAll('[data-view-skill]').forEach(el => el.remove());

    styles.forEach(href => {
      const l = document.createElement('link');
      l.rel = 'stylesheet'; l.href = href;
      l.dataset.viewSkill = '1';
      document.head.appendChild(l);
    });
    for (const src of scripts) {
      await new Promise((ok, err) => {
        const s = document.createElement('script');
        s.src = src; s.onload = ok; s.onerror = err;
        s.dataset.viewSkill = '1';
        document.body.appendChild(s);
      });
    }
  } catch (e) { console.warn('[Jarvis] view skills load error:', e); }
};
window.loadViewSkills();

// Mise à jour du placeholder et du brand avec le nom de l'assistant
(function() {
  var assistantName = window.JARVIS_ASSISTANT_NAME || 'Jarvis';
  var hcwInput = document.getElementById('hcw-input');
  if (hcwInput) {
    hcwInput.placeholder = 'Écrire à ' + assistantName + '…';
  }
  var brandEl = document.querySelector('.home-signature .brand');
  if (brandEl) {
    brandEl.textContent = assistantName.toUpperCase();
  }
})();

// ── Bouton "Mode veille" — à côté de Mission Control ────────────────────
// Réutilise le sleep screen existant (wake_sequence.js), normalement affiché
// une seule fois au chargement de la page. Ici on le remonte à la demande :
// clic sur le bouton → écran STANDBY.
// Réveil ensuite :
//   - clic / touche clavier → accès physique direct, pas de vérification
//     (tu es déjà devant la machine, c'est une preuve de présence suffisante)
//   - double clap → potentiellement déclenché à distance par n'importe qui à
//     portée de voix → passe par le scan facial + vivacité avant d'entrer.
(function () {
  function syncSleepBtn() {
    const mc = document.getElementById('j-rooms-mc');
    const btn = document.getElementById('j-sleep-btn');
    if (!mc || !btn) return;
    const r = mc.getBoundingClientRect();
    btn.style.left = (r.right + 10) + 'px';
    btn.style.height = r.height + 'px';
    // Le bouton n'a de sens que sur la home. Les "pages" (Réglages, Atelier...)
    // ne sont PAS de vraies navigations : Jarvis.navigateFrame() (home.js) les
    // charge dans une iframe persistante (#page-frame) sans jamais recharger ce
    // document — document.body.dataset.mode reste donc "home" en permanence
    // ici, peu importe la page affichée. Le vrai signal est .is-active sur
    // l'iframe, posé/retiré par navigateFrame() et par le popstate (retour nav.).
    const frame = document.getElementById('page-frame');
    const frameActive = !!(frame && frame.classList.contains('is-active'));
    btn.style.display = frameActive ? 'none' : '';
  }

  function activateSleepNow() {
    if (document.getElementById('wake-sleep-root')) return;
    if (typeof window.createSleepScreen !== 'function') return;
    const root = document.createElement('div');
    root.id = 'wake-sleep-root';
    document.body.appendChild(root);
    const sleep = window.createSleepScreen(root, {
      // Seul le clap (source potentiellement distante) passe par le scan facial
      // + vivacité. Clic/touche = accès physique direct, réveil immédiat sans
      // vérification (crossfade, comme enterWake() plus haut pour le clap).
      onWake: function (source) {
        if (source === 'clap') {
          mountFaceCheck();
          sleep.fadeOut(200, function () { sleep.destroy(); });
        } else {
          sleep.fadeOut(400, function () { sleep.destroy(); });
        }
      },
    });
  }

  function mountFaceCheck() {
    if (typeof window.createWakeSequence !== 'function') return;
    // Pas de targetCanvas ici : #orb-canvas est déjà piloté par l'orbe
    // persistant du dashboard (home.js). Lui donner la main en causerait un
    // conflit de rendu. La séquence utilise donc son propre canvas autonome,
    // détruit à la fin — l'orbe du dashboard n'est jamais touché.
    const root = document.createElement('div');
    root.id = 'j-veille-facecheck-root';
    document.body.appendChild(root);

    function closeFaceCheck() {
      root.style.transition = 'opacity .35s cubic-bezier(0.32,0.72,0,1)';
      root.style.opacity = '0';
      setTimeout(function () {
        try { seq.destroy(); } catch (e) {}
        if (root.parentNode) root.parentNode.removeChild(root);
      }, 400);
    }

    const seq = window.createWakeSequence(root, {
      requireFace: true,
      skippable: false,
      // Contrairement au cold boot (CDC C4, ne bloque jamais) : ici on veut un
      // vrai verrou. blockOnUnrecognized fait passer par onFailure au lieu
      // d'avancer automatiquement vers le dashboard.
      blockOnUnrecognized: true,
      // Anti-spoofing léger : exige un clignement des yeux réel pendant le
      // scan (une photo/écran de téléphone ne cligne jamais des yeux).
      requireLiveness: true,
      onComplete: closeFaceCheck,
      onFailure: function () {
        // Visage non reconnu → retour en veille, nouvel essai possible.
        if (root.parentNode) root.parentNode.removeChild(root);
        activateSleepNow();
      },
    });
    if (!seq && root.parentNode) root.parentNode.removeChild(root);
  }

  function mountSleepBtn() {
    if (document.getElementById('j-sleep-btn')) return;
    const btn = document.createElement('button');
    btn.id = 'j-sleep-btn';
    btn.className = 'rooms-mc';
    btn.style.left = 'auto';
    btn.innerHTML = '<span class="mc-dot"></span><span>Mode veille</span>';
    btn.addEventListener('click', activateSleepNow);
    document.body.appendChild(btn);
    syncSleepBtn();

    // Suit les changements de page (home ↔ config/capacités/...), portés par
    // la classe .is-active de l'iframe #page-frame (posée/retirée par
    // Jarvis.navigateFrame() et par le popstate du bouton retour navigateur).
    const frame = document.getElementById('page-frame');
    if (frame) {
      new MutationObserver(syncSleepBtn).observe(frame, { attributes: true, attributeFilter: ['class'] });
    }
    window.addEventListener('popstate', syncSleepBtn);
  }

  window.addEventListener('resize', syncSleepBtn);
  const _sleepBtnWait = setInterval(function () {
    if (document.getElementById('j-rooms-mc')) {
      mountSleepBtn();
      clearInterval(_sleepBtnWait);
    }
  }, 100);
})();
</script>
</body>
</html>
